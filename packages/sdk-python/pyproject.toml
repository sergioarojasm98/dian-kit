[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dian-kit"
version = "0.0.1"
description = "Python SDK for DIAN electronic invoicing in Colombia"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Sergio Rojas", email = "dian-kit@sergioarojasm98.com" },
]
keywords = ["dian", "factura-electronica", "colombia", "ubl", "invoice"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "lxml>=5.0.0",
  "signxml>=4.0.0",
  "pydantic>=2.0.0",
  "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/sergioarojasm98/dian-kit"
Repository = "https://github.com/sergioarojasm98/dian-kit/tree/main/packages/sdk-python"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
