[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dian-kit-fastapi"
version = "0.0.1"
description = "FastAPI middleware for DIAN electronic invoicing in Colombia"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Sergio Rojas", email = "dian-kit@sergioarojasm98.com" },
]
keywords = ["dian", "fastapi", "factura-electronica", "colombia"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "dian-kit",
  "fastapi>=0.100.0",
]

[project.urls]
Homepage = "https://github.com/sergioarojasm98/dian-kit"
Repository = "https://github.com/sergioarojasm98/dian-kit/tree/main/plugins/fastapi"
